<style>
  :root {
    --bg-dark: #0a0a0c;
    --primary-color: #ff0055;
    --primary-gradient: linear-gradient(135deg, #ff0055, #7000ff);
    --text-main: #ffffff;
    --text-muted: #a0a0aa;
    --card-width: 260px;
    --card-height: 380px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
  zoom:75%;
}

/* Scrollbar Personalizado */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #111; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }


/* HERO BANNER */
.hero {
    height: 85vh;
    background-size: cover;
    background-position: center top;
    display: flex;
    align-items: center;
    padding: 0 5%;
    position: relative;
    transition: background-image 0.5s ease-in-out;
}
.hero-overlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(75deg, rgba(10,10,12,0.95) 30%, rgba(10,10,12,0.3) 70%, transparent 100%),
                linear-gradient(to top, var(--bg-dark) 0%, transparent 20%);
    z-index: 1;
}
.hero-content { position: relative; z-index: 2; max-width: 650px; }
.tag-trending {
    display: inline-block; background: rgba(255, 0, 85, 0.2);
    color: #ff3377; padding: 5px 12px; border-radius: 20px;
    font-size: 12px; font-weight: bold; margin-bottom: 15px;
}
.hero h1 { font-size: 56px; font-weight: 800; margin-bottom: 15px; line-height: 1.1; }
.hero p { color: var(--text-muted); font-size: 16px; line-height: 1.6; margin-bottom: 30px; }

.btn {
    padding: 12px 28px; font-size: 15px; font-weight: 600;
    border-radius: 30px; cursor: pointer; border: none; margin-right: 15px;
    transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px;
}
.btn-primary { background: var(--primary-gradient); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,0,85,0.4); }

/* CONTENEDOR SLIDER */
.main-container { padding: 40px 5%; margin-top: -50px; position: relative; z-index: 3; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.section-header h2 { font-size: 22px; font-weight: 600; }
.slider-controls { display: flex; gap: 10px; }
.ctrl-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: white; width: 35px; height: 35px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;
}
.ctrl-btn:hover { background: var(--primary-color); border-color: var(--primary-color); }

.movie-slider {
    display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding: 10px 0;
}
.movie-slider::-webkit-scrollbar { display: none; } /* Ocultar barra nativa */

/* TARJETAS PREMIUM */
.movie-card {
    min-width: var(--card-width); width: var(--card-width);
    height: var(--card-height); border-radius: 16px;
    position: relative; overflow: hidden; cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
}
.movie-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.card-details {
    position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 20px;
    background: linear-gradient(to top, rgba(10,10,12,1) 0%, rgba(10,10,12,0.8) 50%, transparent 100%);
    opacity: 0; transform: translateY(20px); transition: all 0.3s ease;
}
.movie-card:hover { transform: translateY(-10px) scale(1.02); }
.movie-card:hover img { transform: scale(1.1); }
.movie-card:hover .card-details { opacity: 1; transform: translateY(0); }
.card-details h4 { font-size: 18px; margin-bottom: 5px; }
.card-meta { font-size: 12px; color: var(--primary-color); font-weight: bold; }

/* MODAL DE REPRODUCTOR CINEMA */
.video-modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    visibility: hidden; opacity: 0; transition: all 0.4s ease;
}
.video-modal.active { visibility: visible; opacity: 1; }
.modal-backdrop {
    position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
}
.modal-content {
    position: relative; width: 90%; max-width: 900px; background: #121214;
    border-radius: 16px; overflow: hidden; z-index: 1002;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.4s ease;
}
.video-modal.active .modal-content { transform: scale(1); }
.close-modal {
    position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1);
    color: white; border: none; width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; z-index: 10; font-size: 18px; transition: 0.3s;
}
.close-modal:hover { background: var(--primary-color); }
.video-wrapper { position: relative; padding-top: 56.25%; /* 16:9 Aspect Ratio */ }
.video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
.modal-info { padding: 25px; }
.modal-info h3 { font-size: 24px; margin-bottom: 10px; }
.modal-info p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }

// Instancia inicial por defecto apuntando al primer elemento del catálogo
let activeMovie = movieDatabase[0];

/* ==========================================================================
   2. INICIALIZACIÓN Y CONTROL DEL DOM (DOMContentLoaded)
   ========================================================================== */
document.addEventListener("DOMContentLoaded", () => {
    // Renderizado Inicial Dinámico de las filas del catálogo
    updateHeroBanner(activeMovie);
    renderSlider(movieDatabase, "movie-container");
    renderSlider(recentMovies, "recent-container");
    renderSlider(originalSeries, "series-container"); 

    // Activación de Listeners lógicos de componentes
    setupEventListeners();
    setupRealTimeSearch();
});

/* ==========================================================================
   3. FUNCIONES DE RENDERIZADO Y BANNER HERO
   ========================================================================== */
function updateHeroBanner(movie) {
    activeMovie = movie;
    const hero = document.getElementById("hero-banner");
    if (!hero) return;
    hero.style.backgroundImage = `url('${movie.img}')`;
    document.getElementById("hero-title").innerText = movie.title;
    document.getElementById("hero-desc").innerText = movie.desc;
}
/**
 * Abre la ventana modal y carga el video (MP4 o WebM) de la película seleccionada
 */
function abrirReproductorModal(movie) {
    const modal = document.getElementById("video-modal");
    const wrapper = document.getElementById("video-wrapper-container") || document.querySelector(".video-wrapper");
    
    if (!modal || !wrapper) return;

    // Inyectar la información de los textos descriptivos en el modal
    document.getElementById("modal-video-title").innerText = movie.title;
    document.getElementById("modal-video-desc").innerText = movie.desc;
    
    // Inyectar el reproductor adaptado para leer tanto MP4 como WebM dinámicamente
    wrapper.innerHTML = `
        <video id="main-video" controls autoplay poster="${movie.img}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;">
            <source src="${movie.videoUrl}" type="video/webm">
            <source src="${movie.videoUrl}" type="video/mp4">
            Tu navegador no soporta la reproducción de video HTML5.
        </video>
    `;
    
    const videoElemento = document.getElementById("main-video");
    if (videoElemento) {
        videoElemento.load();
        videoElemento.play().catch(err => {
            console.log("La reproducción automática requiere una interacción previa del usuario:", err);
        });
    }
    
    modal.classList.add("active");
}


function renderSlider(movies, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = "";

    movies.forEach(movie => {
        const card = document.createElement("div");
        card.classList.add("movie-card");
        card.innerHTML = `
            <img src="${movie.thumb}" alt="${movie.title}">
            <div class="card-details">
                <h4>${movie.title}</h4>
                <div class="card-meta">${movie.genre}</div>
            </div>
        `;
        
        // Cada tarjeta abre directamente su propio reproductor MP4 correspondiente
        card.addEventListener("click", () => {
            abrirReproductorModal(movie);
        });

        container.appendChild(card);
    });
}
/* ==========================================================================
   4. CONTROLADORES DE EVENTOS (FLECHAS, MODAL CINEMA, VIDEO)
   ========================================================================== */
function setupEventListeners() {
    const modal = document.getElementById("video-modal");
    const video = document.getElementById("main-video");
    
    // Botón reproducir del Banner Hero principal
    const playBtn = document.getElementById("btn-hero-play");
    if (playBtn) {
        playBtn.addEventListener("click", () => {
            if (activeMovie) abrirReproductorModal(activeMovie);
        });
    }

    // Controles para cerrar el Modal Cinema
    const closeBtn = document.getElementById("close-modal");
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    
    const backdrop = document.querySelector(".modal-backdrop");
    if (backdrop) backdrop.addEventListener("click", closeModal);

    // Cerrar también con la tecla Escape del teclado físico
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });

    function closeModal() {
        if (modal) modal.classList.remove("active");
        if (video) {
            video.pause();
            video.src = ""; 
        }
    }

    // Desplazamiento fila 1 (Recomendadas)
    const slider1 = document.getElementById("movie-container");
    const right1 = document.getElementById("slide-right");
    const left1 = document.getElementById("slide-left");
    if (slider1) {
        if (right1) right1.addEventListener("click", () => { slider1.scrollLeft += 300; });
        if (left1) left1.addEventListener("click", () => { slider1.scrollLeft -= 300; });
    }

    // Desplazamiento fila 2 (Recientes)
    const slider2 = document.getElementById("recent-container");
    const right2 = document.getElementById("slide-right-recent");
    const left2 = document.getElementById("slide-left-recent");
    if (slider2) {
        if (right2) right2.addEventListener("click", () => { slider2.scrollLeft += 300; });
        if (left2) left2.addEventListener("click", () => { slider2.scrollLeft -= 300; });
    }

    // Desplazamiento fila 3 (Series originales)
    const slider3 = document.getElementById("series-container");
    const right3 = document.getElementById("slide-right-series");
    const left3 = document.getElementById("slide-left-series");
    if (slider3) {
        if (right3) right3.addEventListener("click", () => { slider3.scrollLeft += 300; });
        if (left3) left3.addEventListener("click", () => { slider3.scrollLeft -= 300; });
    }
}

/* ==========================================================================
   5. MOTOR DE BÚSQUEDA EN TIEMPO REAL
   ========================================================================== */
function setupRealTimeSearch() {
    const searchInput = document.getElementById("search-input");
    const catalogContainer = document.querySelector(".main-container") || document.querySelector("main");
    
    if (!searchInput) return;

    let noResultsMessage = document.getElementById("no-results-message");
    if (!noResultsMessage && catalogContainer) {
        noResultsMessage = document.createElement("div");
        noResultsMessage.id = "no-results-message";
        noResultsMessage.innerHTML = `<p class="no-results-text" style="color: #a0a0aa; font-size: 16px; margin: 40px 0; text-align: center;">No se encontraron películas o series que coincidan con tu búsqueda.</p>`;
        noResultsMessage.style.display = "none";
        noResultsMessage.style.width = "100%";
        catalogContainer.appendChild(noResultsMessage);
    }

    searchInput.addEventListener("input", (e) => {
        const textoBusqueda = limpiarTexto(e.target.value);
        const tarjetas = document.querySelectorAll(".movie-card"); 
        let coincidencias = 0;

        tarjetas.forEach(tarjeta => {
            const tituloElemento = tarjeta.querySelector("h4") || tarjeta.querySelector("h3") || tarjeta;
            const textoTarjeta = limpiarTexto(tituloElemento.textContent);

            if (textoTarjeta.includes(textoBusqueda)) {
                tarjeta.style.display = ""; 
                coincidencias++;
            } else {
                tarjeta.style.display = "none"; 
            }
        });

        if (noResultsMessage) {
            noResultsMessage.style.display = (coincidencias === 0 && textoBusqueda !== "") ? "block" : "none";
        }
    });
}

function limpiarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
}
