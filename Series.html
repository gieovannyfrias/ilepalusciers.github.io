<style>
    /* --- VARIABLES GLOBALES DEL SITIO --- */
    :root {
        --bg-dark: #0a0a0c;
        --primary-color: #ff0055;
        --primary-gradient: linear-gradient(135deg, #7000ff, #ff007f);
        --text-main: #ffffff;
        --text-muted: #a0a0aa;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        overflow-x: hidden;
      zoom:75%;
    }

    /* Scrollbar Personalizado */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

    /* CONTENEDOR PRINCIPAL */
    .main-container { 
        padding: 40px 5%; 
        width: 100%;
        padding-top: 120px; 
    }

    /* BARRA DE FILTROS POR CATEGORÍA */
    .category-bar { 
        display: flex; 
        gap: 15px; 
        margin-bottom: 40px; 
        overflow-x: auto; 
        padding-bottom: 10px; 
        scrollbar-width: none;    
        flex-wrap: wrap; 
            padding-top: 100px;

    }
    .category-bar::-webkit-scrollbar { display: none; }
    
    .cat-btn {
        background: rgba(255, 255, 255, 0.05); 
        color: var(--text-main); 
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 25px; 
        border-radius: 20px; 
        font-weight: 600; 
        cursor: pointer; 
        white-space: nowrap;
        transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }
    .cat-btn:hover { 
        background: rgba(255, 255, 255, 0.1); 
        border-color: rgba(255, 255, 255, 0.2); 
    }
    .cat-btn.active { 
        background: var(--primary-gradient); 
        color: white; 
        border: none; 
        box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3); 
    }

    /* ENCABEZADOS Y CONTROLES DEL CARRETE */
    .section-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 25px; 
    }
    .section-header h2 { font-size: 24px; font-weight: 700; }
    .slider-controls { display: flex; gap: 10px; }
    
    .ctrl-btn {
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.08); 
        color: var(--text-main);
        width: 40px; height: 40px; 
        border-radius: 50%; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        cursor: pointer; 
        transition: background 0.3s, border-color 0.3s;
    }
    .ctrl-btn:hover { 
        background: rgba(255, 255, 255, 0.15); 
        border-color: rgba(255, 255, 255, 0.2); 
    }

    /* GRILLA DE TARJETAS (CONFIGURACIÓN A 5 FILAS AUTOMÁTICAS) */
    .movie-slider { 
        display: grid;
        grid-template-rows: repeat(5, auto);
        grid-auto-flow: column;
        grid-auto-columns: calc((100% - 80px) / 5); 
        gap: 20px; 
        width: 100%; 
        overflow-x: auto; 
        scroll-behavior: smooth;
        padding: 10px 0 25px 0;
        scrollbar-width: none; 
    }
    .movie-slider::-webkit-scrollbar { display: none; }

    /* TARJETAS PREMIUM DEL CATÁLOGO */
    .movie-card {
        width: 100%;
        background: rgba(20, 20, 25, 0.6); 
        border-radius: 12px; 
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.03); 
        position: relative;
        box-sizing: border-box;
        transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s;
    }
    .movie-card:hover { 
        transform: translateY(-8px) scale(1.02); 
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5); 
        z-index: 10;
    }

    /* EFECTO DE REPRODUCCIÓN (PLAY OVERLAY) */
    .img-container { 
        position: relative; 
        width: 100%; 
        height: 460px; 
        overflow: hidden; 
        cursor: pointer; 
    }
    .img-container img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
    }
    .play-overlay {
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5); 
        display: flex; 
        justify-content: center; 
        align-items: center;
        opacity: 0; 
        transition: opacity 0.3s ease;
    }
    .play-overlay i { 
        color: #fff; 
        font-size: 40px; 
        transform: scale(0.8); 
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .movie-card:hover .play-overlay { opacity: 1; }
    .movie-card:hover .play-overlay i { transform: scale(1); }

    .card-details { padding: 15px; }
    .card-details h4 { 
        font-size: 16px; 
        font-weight: 600; 
        margin-bottom: 5px; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
    }
    .card-meta { font-size: 13px; color: var(--text-muted); }

    /* MODAL DEL REPRODUCTOR CINEMA */
    .video-modal {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100vh;
        z-index: 200;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
    }
    .video-modal.active { opacity: 1; pointer-events: auto; }
    
    .modal-backdrop { 
        position: absolute; 
        width: 100%; height: 100%; 
        background: rgba(5, 5, 8, 0.95); 
        backdrop-filter: blur(8px); 
    }
    
    .modal-content {
        position: relative; 
        width: 90%; 
        max-width: 900px; 
        background: #121216;
        border-radius: 16px; 
        overflow: hidden; 
        border: 1px solid rgba(255, 255, 255, 0.05); 
        z-index: 2;
    }
    
    .video-player-container { 
        position: relative; 
        width: 100%; 
        padding-top: 56.25%; /* Relación de aspecto 16:9 */ 
        background: #000; 
    }
    .video-player-container video { 
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        border: none; 
    }
    
    .close-modal {
        position: absolute; 
        top: 15px; right: 15px; 
        background: rgba(0,0,0,0.5); 
        border: none;
        color: #fff; 
        width: 35px; height: 35px; 
        border-radius: 50%; 
        display: flex; 
        justify-content: center;
        align-items: center; 
        cursor: pointer; 
        z-index: 10; 
        transition: background 0.3s;
        font-size: 18px;
    }
    .close-modal:hover { background: var(--primary-gradient); }
    
    .modal-details { padding: 25px; }
    .modal-details h3 { font-size: 22px; margin-bottom: 5px; }
    .modal-details p { color: var(--text-muted); font-size: 14px; }

    /* RESPONSIVE MEDIA QUERIES */
    @media (max-width: 1200px) { .movie-slider { grid-auto-columns: calc((100% - 60px) / 4); } }
    @media (max-width: 992px) { .movie-slider { grid-auto-columns: calc((100% - 40px) / 3); } }
    @media (max-width: 768px) { .movie-slider { grid-auto-columns: calc((100% - 20px) / 2); } }
    @media (max-width: 480px) { .movie-slider { grid-auto-columns: 100%; } }
  /* --- BOTÓN VER TEMPORADA Y DROPDOWN --- */
.modal-episodes-toggle {
    position: relative;
    width: 100%;
}
.btn-season-trigger {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s;
}
.btn-season-trigger:hover {
    background: var(--primary-gradient);
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(255, 0, 85, 0.3);
}
.episodes-dropdown-list {
    background: #18181f;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    margin-top: 10px;
    padding: 10px;
    max-height: 200px;
    overflow-y: auto;
}
.episode-item {
    padding: 8px 12px;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    transition: 0.2s;
    font-size: 14px;
}
.episode-item:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
}

</style>

let currentMoviesList = contentDatabase; 
let currentPage = 0;
// Paginación configurada para el bloque de 25 series (Matriz 5x5)
const moviesPerPage = 25; 
let searchText = ""; 
let selectedCategory = "todos";

/* ==========================================================================
   2. INICIALIZACIÓN PRINCIPAL (DOMContentLoaded)
   ========================================================================== */
document.addEventListener("DOMContentLoaded", () => {
    showPage(0); 
    setupCategoryFilters();
    setupRealTimeSearch();
    setupSliderControls();
    setupModalEvents();
});

/* ==========================================================================
   3. SISTEMA DE PAGINACIÓN Y RENDERIZADO
   ========================================================================== */
function showPage(pageIndex) {
    currentPage = pageIndex;
    const startIndex = currentPage * moviesPerPage;
    const endIndex = startIndex + moviesPerPage;
    renderSlider(currentMoviesList.slice(startIndex, endIndex), "movie-container");
}

function renderSlider(moviesList, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = "";

    if (moviesList.length === 0) {
        container.innerHTML = "<p style='padding: 20px; color: #a0a0aa; text-align: center; width: 100%;'>No se encontraron series disponibles.</p>";
        return;
    }

    moviesList.forEach(movie => {
        const card = document.createElement("div");
        card.classList.add("movie-card");
        card.innerHTML = `
            <div class="img-container">
                <img src="${movie.thumb}" alt="${movie.title}">
                <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
            </div>
            <div class="card-details">
                <h4>${movie.title}</h4>
                <div class="card-meta">${movie.genre}</div>
            </div>
        `;

        card.addEventListener("click", () => openVideoPlayer(movie));
        container.appendChild(card);
    });
}

/* ==========================================================================
   4. CONTROLADORES DEL REPRODUCTOR (MODAL RE-ESTRUCTURADO)
   ========================================================================== */
function openVideoPlayer(movie) {
    const modal = document.getElementById("video-modal");
    const wrapper = document.getElementById("video-wrapper-container") || document.querySelector(".video-player-container");
    const seasonWrapper = document.getElementById("modal-episodes-wrapper");
    const seasonBtn = document.getElementById("btn-ver-temporada");
    
    if (!modal || !wrapper) return;

    document.getElementById("modal-video-title").innerText = movie.title;
    
    const descElement = document.getElementById("modal-video-desc");
    if (descElement) descElement.innerText = movie.genre;
    
    // Inyectar el reproductor MP4/WebM nativo
    wrapper.innerHTML = `
        <video id="main-video" controls autoplay poster="${movie.thumb}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;">
            <source src="${movie.videoUrl}" type="video/webm">
            <source src="${movie.videoUrl}" type="video/mp4">
            Tu navegador no soporta la reproducción de video HTML5.
        </video>
    `;
    
    // CONTROL DEL ENLACE DE TEMPORADAS
    if (seasonWrapper && seasonBtn) {
        if (movie.isSerie && movie.temporadaUrl) {
            seasonWrapper.style.display = "block";
            
            // Al hacer clic, redirige al archivo .html específico de esa serie
            seasonBtn.onclick = () => {
                window.location.href = movie.temporadaUrl;
            };
        } else {
            seasonWrapper.style.display = "none";
        }
    }
    
    modal.classList.add("active");
    
    const nuevoVideoNode = document.getElementById("main-video");
    if (nuevoVideoNode) {
        nuevoVideoNode.load();
        nuevoVideoNode.play().catch(err => console.log("La reproducción automática requiere interacción:", err));
    }
}
function setupModalEvents() {
    const modal = document.getElementById("video-modal");
    const wrapper = document.getElementById("video-wrapper-container");
    const closeBtn = document.getElementById("close-modal");
    const backdrop = document.getElementById("modal-backdrop");
    const seasonBtn = document.getElementById("btn-ver-temporada");
    const dropdown = document.getElementById("episodes-dropdown");

    // Evento para alternar el menú desplegable de capítulos
    if (seasonBtn && dropdown) {
        seasonBtn.onclick = (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
        };
    }

    const closeModal = () => {
        if (modal) modal.classList.remove("active");
        const videoActivo = document.getElementById("main-video");
        if (videoActivo) { videoActivo.pause(); videoActivo.src = ""; }
        if (wrapper) wrapper.innerHTML = ""; 
    };

    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    if (backdrop) backdrop.addEventListener("click", closeModal);
}


/* ==========================================================================
   5. FILTRADO AVANZADO Y BÚSQUEDA CRUZADA
   ========================================================================== */
function setupCategoryFilters() {
    const buttons = document.querySelectorAll(".cat-btn");
    buttons.forEach(btn => {
        btn.addEventListener("click", () => {
            buttons.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            
            selectedCategory = btn.getAttribute("data-genre") || "todos";
            aplicarFiltrosCruzados();
        });
    });
}

function setupRealTimeSearch() {
    const searchInput = document.getElementById("search-input");
    if (!searchInput) return;
    
// ... Continuación directa dentro de setupRealTimeSearch() desde: if (!searchInput) return;
    searchInput.addEventListener("input", (e) => {
        searchText = limpiarTexto(e.target.value);
        aplicarFiltrosCruzados();
    });
}

function aplicarFiltrosCruzados() {
    const sectionTitle = document.getElementById("section-title-dynamic");

    currentMoviesList = contentDatabase.filter(movie => {
        const coincideCategoria = (selectedCategory === "todos" || movie.category === selectedCategory);
        const coincideBuscador = limpiarTexto(movie.title).includes(searchText);
        return coincideCategoria && coincideBuscador;
    });

    if (sectionTitle) {
        sectionTitle.textContent = selectedCategory === "todos" ? "Series Originales" : `Series de ${selectedCategory}`;
    }
    
    showPage(0);
}

/* ==========================================================================
   6. CONTROLES DE DESPLAZAMIENTO DEL SLIDER (PAGINACIÓN)
   ========================================================================== */
function setupSliderControls() {
    const btnRight = document.getElementById("slide-right");
    const btnLeft = document.getElementById("slide-left");

    if (btnRight) {
        btnRight.addEventListener("click", () => { 
            if ((currentPage + 1) * moviesPerPage < currentMoviesList.length) {
                showPage(currentPage + 1); 
            }
        });
    }
    if (btnLeft) {
        btnLeft.addEventListener("click", () => { 
            if (currentPage > 0) {
                showPage(currentPage - 1); 
            }
        });
    }
}

/**
 * Sanitiza textos removiendo diacríticos (acentos) y mayúsculas
 */
function limpiarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
}
